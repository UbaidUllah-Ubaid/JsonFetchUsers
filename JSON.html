<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details Users</title>
    <link rel="stylesheet" href="JSON.css">
    <link rel="stylesheet" href="JSON2.html">
</head>

<body>

    <h2>Users Dashboard</h2>
    <p id="loading">Loading Network data...</p>

    <div class="dashboard-container">
        <ul id="users"></ul>
        <div id="user1">
            <p class="placeholder-text">Click a user from the list to view full profile details.</p>
            <div class="post-btn" id="postingg-btn"><button id="posting-button" class="post-button">Check
                    Posting</button></div>
        </div>
    </div>

    <script>
        async function getUsers() {
            const loading = document.getElementById("loading");
            const userList = document.getElementById("users");
            const detailsBox = document.getElementById("user1");
            const postBtn = document.getElementById("postingg-btn")
            postBtn.style.display = "none"

            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                if (!response.ok) {
                    throw new Error("User NOT found");
                }
                const data = await response.json();

                loading.style.display = "none";

                data.forEach(user => {
                    const li = document.createElement("li");
                    li.innerText = user.name;

                    li.addEventListener('click', function () {
                        detailsBox.innerHTML = "";

                        for (const key in user) {
                            const div = document.createElement("div");
                            div.className = "detail-item";

                            if (typeof user[key] === "object") {
                                if (key === "address") {
                                    div.innerHTML = `
                                        <b>${key}:</b>
                                        <span>${user.address.street}, ${user.address.city} (Zip: ${user.address.zipcode})</span>
                                    `;
                                } else if (key === "company") {
                                    div.innerHTML = `
                                        <b>${key}:</b>
                                        <span>${user.company.name} ("${user.company.catchPhrase}")</span>
                                    `;
                                }
                            } else {
                                div.innerHTML = `<b>${key}:</b> <span>${user[key]}</span>`;
                                postBtn.style.display = '';
                            }
                            detailsBox.appendChild(div);
                            detailsBox.appendChild(postBtn)
                        }
                        postBtn.addEventListener("click", function () {
                            window.location.href = `JSON2.html?userId=${user.id}`
                        });
                    });

                    userList.appendChild(li);
                });
            }
            catch (error) {
                loading.innerText = error.message;
                loading.style.color = "#ef4444";
            }
        }
        getUsers();
    </script>
</body>

</html>
