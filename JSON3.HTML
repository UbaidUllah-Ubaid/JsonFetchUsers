<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Posts</title>
    <link rel="stylesheet" href="JSON2.css">
</head>

<body>
    <div class="main-cont">
        <p id="loading">NETWORK Loading...</p>
        <ul id="post-list"></ul>
    </div>

    <script>

        const firstPart = window.location.search;
        const secondPart = new URLSearchParams(firstPart);
        const userId = secondPart.get("userId");
        const loading = document.getElementById("loading");

        let openedCommentUl = null;

        async function getPost() {
            const postList = document.getElementById("post-list");
            try {
                const respons = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userId}`);

                if (!respons.ok) {
                    throw Error("Something Wrong");
                }
                const data = await respons.json();
                loading.style.display = "none";

                data.forEach(post => {
                    let commentsLoaded = false
                    let commentsVisible = false;
                    let commentsData = [];
                    let commentUl = null;


                    const li = document.createElement("li");
                    li.className = "post-list";
                    li.innerHTML = `
                        <div><h4>User ID:</h4><span>${post.userId}</span></div>
                        <div><h4>Post ID:</h4><span>${post.id}</span></div>
                        <div><h4>Title:</h4><span>${post.title}</span></div>
                        <div><h4>Body:</h4><span>${post.body}</span></div>
                        <button class="comment-btn">View Comment</button>
                    `;
                    postList.appendChild(li);


                    li.addEventListener("click", async (e) => {

                        if (!e.target.classList.contains("comment-btn")) return;

                        if (openedCommentUl && openedCommentUl !== commentUl) {
                            openedCommentUl.remove();
                        }

                        if (commentsVisible) {
                            commentUl.remove();
                            commentsVisible = false;
                            openedCommentUl = null;
                            return;
                        }

                        if (commentsLoaded) {
                            renderComments();
                            return;
                        }
                        try {
                            const response = await fetch(
                                `https://jsonplaceholder.typicode.com/comments?postId=${post.id}`
                            );
                            commentsData = await response.json();
                            commentsLoaded = true;
                            renderComments();

                        } catch (error) {
                            console.error(error);
                        }
                    });

                    function renderComments() {
                        commentUl = document.createElement("ul");
                        commentsData.forEach(comment => {
                            const commentsLi = document.createElement("li");
                            commentsLi.className = "comments-list";
                            commentsLi.innerHTML = `
                                <div><h4>Post ID:</h4><span>${comment.postId}</span></div>
                                <div><h4>Comment ID:</h4><span>${comment.id}</span></div>
                                <div><h4>Name:</h4><span>${comment.name}</span></div>
                                <div><h4>Email:</h4><span>${comment.email}</span></div>
                                <div><h4>Body:</h4><span>${comment.body}</span></div>
                            `;
                            commentUl.appendChild(commentsLi);
                        });
                        li.appendChild(commentUl);

                        openedCommentUl = commentUl;
                        commentsVisible = true;
                    }
                });
            }
            catch (error) {

                console.log(error.message);
                loading.innerText = error.message;
                loading.style.color = "#ef4444";
            }
        }
        getPost();

    </script>

</body>
